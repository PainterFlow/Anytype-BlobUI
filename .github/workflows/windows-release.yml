name: Release Windows installer

on:
  push:
    tags:
      - 'v*'
      - 'dev-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, matching blobui-release.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.validate_release.outputs.release_tag }}
      channel: ${{ steps.validate_release.outputs.channel }}
      version: ${{ steps.validate_release.outputs.version }}
      installer_asset: ${{ steps.validate_release.outputs.installer_asset }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag, channel, and branch ancestry
        id: validate_release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content blobui-release.json -Raw | ConvertFrom-Json
          if ($metadata.formatVersion -ne 1 -or $metadata.version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'blobui-release.json must contain formatVersion 1 and a stable X.Y.Z version.'
          }
          if ($env:RELEASE_TAG -cmatch '^v(?<tagVersion>[0-9]+\.[0-9]+\.[0-9]+)$') {
            $channel = 'main'
            $tagVersion = $Matches.tagVersion
            $installerAsset = 'blobui-installer.exe'
            if ($tagVersion -cne $metadata.version) {
              throw 'Stable app tags must match blobui-release.json version as vX.Y.Z.'
            }
            $targetBranch = 'origin/main'
          } elseif ($env:RELEASE_TAG -cmatch '^dev-(?<tagVersion>[0-9]+\.[0-9]+\.[0-9]+)$') {
            $channel = 'dev'
            $tagVersion = $Matches.tagVersion
            $installerAsset = 'blobui-installer-dev.exe'
            if ($metadata.devVersion -cnotmatch '^dev-[0-9]+\.[0-9]+\.[0-9]+$' -or "dev-$tagVersion" -cne $metadata.devVersion) {
              throw 'Dev app tags must match blobui-release.json devVersion as dev-X.Y.Z.'
            }
            $targetBranch = 'origin/dev'
          } else {
            throw 'App release tags must use vX.Y.Z or dev-X.Y.Z.'
          }
          git merge-base --is-ancestor HEAD $targetBranch
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit on $targetBranch."
          }
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "release_tag=$env:RELEASE_TAG`nchannel=$channel`nversion=$tagVersion`ninstaller_asset=$installerAsset`n")

      - name: Select the Node.js toolchain
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: settings-app/package-lock.json

      - name: Select the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain selection failed.' }

      - name: Install frontend dependencies and build Settings
        env:
          BLOBUI_BUILD_ONLY: '1'
          APPDATA: ${{ github.workspace }}\.test-run\ci-roaming
          LOCALAPPDATA: ${{ github.workspace }}\.test-run\ci-local
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          ./scripts/Build-App.ps1 -s -c

      - name: Generate CSS fixtures for frontend behavior tests
        env:
          APPDATA: ${{ github.workspace }}\.test-run\ci-roaming
          LOCALAPPDATA: ${{ github.workspace }}\.test-run\ci-local
          CARGO_TARGET_DIR: ${{ github.workspace }}\settings-app\target
        run: |
          $ErrorActionPreference = 'Stop'
          $manifestPath = 'settings-app/Cargo.toml'
          $filters = @(
            'css::tests::calendar_scoped_rules_export_isolated_dom_fixture',
            'calendar::tests::calendar_v2_fixture_covers_discovery_paging_precedence_and_outages',
            'css::tests::selection_css_defaults_on_and_compiles_independently_of_accent_mode',
            'kanban_css::tests::'
          )
          foreach ($filter in $filters) {
            Write-Host "Generating frontend CSS fixtures with $filter"
            & cargo test --locked --release --manifest-path $manifestPath --bin blobui-settings $filter -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw "CSS fixture generation failed for Rust test filter $filter." }
          }

      - name: Validate the bundled Settings frontend
        working-directory: settings-app
        run: |
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { throw 'Settings frontend component tests failed.' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Settings frontend behavior tests failed.' }

      - name: Build installer and validate the release package without installing
        env:
          RELEASE_CHANNEL: ${{ steps.validate_release.outputs.channel }}
          INSTALLER_ASSET: ${{ steps.validate_release.outputs.installer_asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_CHANNEL -eq 'dev') {
            ./scripts/Build-Installer.ps1 -PackageRelease -BuildChannel dev
          } else {
            ./scripts/Build-Installer.ps1 -PackageRelease
          }
          foreach ($path in @("dist/$env:INSTALLER_ASSET", 'dist/blobui-windows.zip')) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release build did not create $path."
            }
          }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead('dist/blobui-windows.zip')
          try {
            foreach ($name in @('Changelogs.md', 'md-images.yaml')) {
              if (@($archive.Entries | Where-Object { $_.FullName -ceq $name }).Count -ne 1) {
                throw "The release package must contain $name at its root."
              }
            }
            if (@($archive.Entries | Where-Object { $_.FullName -ceq 'settings-app/dist/blobui-settings.exe' }).Count -ne 1) {
              throw 'The release package must contain the built Settings app.'
            }
            if (@($archive.Entries | Where-Object { $_.FullName -ceq 'bin/blob-ui.exe' }).Count -ne 1) {
              throw 'The release package must contain the Anyblob MCP launcher.'
            }
          } finally { $archive.Dispose() }
          Copy-Item -LiteralPath settings-app/markdowns/Changelogs.md -Destination dist/Changelogs.md -Force

      - name: Save validated release files
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Changelogs.md
            dist/${{ steps.validate_release.outputs.installer_asset }}
            dist/blobui-windows.zip

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag' && (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'dev-'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist

      - name: Upload files and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          INSTALLER_ASSET: ${{ needs.build.outputs.installer_asset }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_CHANNEL" == dev ]]; then
            title="BlobUI Dev $RELEASE_VERSION"
            prerelease_args=(--prerelease --latest=false)
          else
            title="BlobUI $RELEASE_VERSION"
            prerelease_args=()
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease_args[@]}" --title "$title" --notes-file dist/Changelogs.md
          else
            gh release edit "$RELEASE_TAG" --notes-file dist/Changelogs.md
          fi
          gh release upload "$RELEASE_TAG" "dist/$INSTALLER_ASSET" dist/blobui-windows.zip --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false "${prerelease_args[@]}"
          elif [[ "$RELEASE_CHANNEL" == dev ]]; then
            gh release edit "$RELEASE_TAG" --prerelease --latest=false
          fi
