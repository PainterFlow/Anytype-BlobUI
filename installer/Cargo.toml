[package]
name = "blobui-installer"
version = "1.0.0"
edition = "2021"

[features]
default = []
development = []

[dependencies]
base64 = "0.22"
crc32fast = "1"
flate2 = "1.1"
regex = "1"
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage", "Win32_Storage_FileSystem"] }
